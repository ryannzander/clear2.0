[project]
name = "clear"
version = "0.1.0"
description = "CLEAR 2.0 — wildfire-smoke early-warning research system for Toronto."
requires-python = ">=3.12,<3.13"
authors = [{ name = "Ryan Zander" }]
dependencies = [
    "pandas>=3.0",  # timeutil's DST errors are pandas 3 ValueErrors (2.x raised pytz types)
    "numpy>=2.0",
    "xarray>=2024.6",
    "zarr>=2.18",
    "pyarrow>=16",
    "pandera>=0.20",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "matplotlib>=3.9",
    "plotly>=5.22",
    "shapely>=2.0",  # point-in-City and cell overlap (clear.stations, clear.grid); CI has no geo group
]

[project.scripts]
clear = "clear.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pytest>=8.2",
    "pre-commit>=3.7",
    "jupytext>=1.16",
    # Type stubs so pyright strict can see into pandas / PyYAML.
    "pandas-stubs>=2.2",
    "types-pyyaml>=6.0",
]
knowledge = ["markitdown[docx,pdf,xlsx]>=0.1"]
geo = ["cartopy>=0.23", "geopandas>=1.0", "netcdf4>=1.7"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clear"]

# --- ruff -------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
# Hooks run under the system Python (>= 3.10) and scripts must too, so pyupgrade must not
# rewrite them to 3.11+ APIs (e.g. datetime.UTC).
per-file-target-version = { ".claude/hooks/*.py" = "py310", "scripts/*.py" = "py310" }
# Anchored to the repo root: a bare "data" would also skip e.g. src/clear/data/.
extend-exclude = [
    "./archive",
    "./data",
    "./inbox",
    "./CLEAR 2.0 (misc docs)",
    "./RAW Data",
    "./mlruns",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Tests, notebooks and figure scripts: docstrings optional.
"tests/**" = ["D"]
"notebooks/**" = ["D", "E402"]
"figures/src/**" = ["D", "N999"]
# Repo tooling: module docstring required, function docstrings optional.
"scripts/**" = ["D103", "D102", "D101"]
".claude/hooks/**" = ["D103"]

[tool.ruff.format]
quote-style = "double"
# Code blocks in docs are illustrative (placeholders like <slug>); don't format them.
exclude = ["**/*.md"]

# --- pyright ----------------------------------------------------------------
[tool.pyright]
include = ["src", "tests", "scripts", "figures/src"]
exclude = [
    "**/__pycache__",
    ".venv",
    "archive",
    "data",
    "inbox",
    "notebooks",
    "mlruns",
    "CLEAR 2.0 (misc docs)",
    "RAW Data",
]
typeCheckingMode = "basic"
strict = ["src"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

# --- pytest -----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
markers = ["golden: reproduces numbers from old docs; needs local data/ (skips in CI)"]
